<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Pame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a001a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        h1 {
            color: #ffd700;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #ffe680;
            margin-bottom: 20px;
        }

        /* Reproductor de audio personalizado */
        .audio-player {
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            max-width: 300px;
            height: 40px;
            border-radius: 20px;
            outline: none;
        }

        .photo-frame {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a002a;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .flower-container {
            position: relative;
            width: 200px;
            height: 220px;
            margin: 0 auto;
        }

        .flower {
            position: absolute;
            transform-origin: bottom center;
            animation: sway 3s ease-in-out infinite alternate;
        }

        .flower-1 { left: 30px; bottom: 10px; animation-delay: 0s; }
        .flower-2 { left: 80px; bottom: 20px; animation-delay: 0.5s; }
        .flower-3 { left: 130px; bottom: 10px; animation-delay: 1s; }

        .stem {
            width: 8px;
            height: 120px;
            background: #4caf50;
            margin: 0 auto;
            border-radius: 4px;
        }

        .center {
            width: 35px;
            height: 35px;
            background: #8b4513;
            border-radius: 50%;
            margin: -15px auto 0;
            position: relative;
            z-index: 2;
        }

        .petals {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            z-index: 1;
        }

        .petal {
            position: absolute;
            width: 25px;
            height: 45px;
            background: #ffd700;
            border-radius: 50%;
            top: 20px;
            left: 27px;
            transform-origin: center bottom;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.8);
        }

        .p1 { transform: rotate(0deg) translateY(-20px); }
        .p2 { transform: rotate(45deg) translateY(-20px); }
        .p3 { transform: rotate(90deg) translateY(-20px); }
        .p4 { transform: rotate(135deg) translateY(-20px); }
        .p5 { transform: rotate(180deg) translateY(-20px); }
        .p6 { transform: rotate(225deg) translateY(-20px); }
        .p7 { transform: rotate(270deg) translateY(-20px); }
        .p8 { transform: rotate(315deg) translateY(-20px); }

        @keyframes sway {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        .footer-message {
            margin-top: 30px;
            font-size: 1rem;
            color: #d8b4fe;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Te amo Pame</h1>
        <p class="subtitle">Estas flores amarillas son para ti 💛</p>

        <!-- Reproductor de la canción Peaches -->
        <div class="audio-player">
            <audio controls autoplay loop>
                <source src="https://ia801602.us.archive.org/11/items/jack-black-peaches/Jack%20Black%20-%20Peaches.mp3" type="audio/mpeg">
                Tu navegador no soporta el reproductor de audio.
            </audio>
        </div>

        <div class="photo-frame">
            <img src="https://via.placeholder.com/200/ffd700/000000?text=Tu+Foto+Aquí" alt="Foto con Pame">
        </div>

        <div class="flower-container">
            <div class="flower flower-1">
                <div class="petals">
                    <div class="petal p1"></div><div class="petal p2"></div>
                    <div class="petal p3"></div><div class="petal p4"></div>
                    <div class="petal p5"></div><div class="petal p6"></div>
                    <div class="petal p7"></div><div class="petal p8"></div>
                </div>
                <div class="center"></div>
                <div class="stem"></div>
            </div>

            <div class="flower flower-2">
                <div class="petals">
                    <div class="petal p1"></div><div class="petal p2"></div>
                    <div class="petal p3"></div><div class="petal p4"></div>
                    <div class="petal p5"></div><div class="petal p6"></div>
                    <div class="petal p7"></div><div class="petal p8"></div>
                </div>
                <div class="center"></div>
                <div class="stem"></div>
            </div>

            <div class="flower flower-3">
                <div class="petals">
                    <div class="petal p1"></div><div class="petal p2"></div>
                    <div class="petal p3"></div><div class="petal p4"></div>
                    <div class="petal p5"></div><div class="petal p6"></div>
                    <div class="petal p7"></div><div class="petal p8"></div>
                </div>
                <div class="center"></div>
                <div class="stem"></div>
            </div>
        </div>

        <p class="footer-message">
            Aunque estemos lejos, siempre busco la manera de sacarte una sonrisa. ¡Que tengas un día hermoso!
        </p>
    </div>

</body>
</html>
